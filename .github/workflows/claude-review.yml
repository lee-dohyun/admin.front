# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 Next.js 프론트이며 게이트웨이를 경유해 API 를 호출한다.
            
            우선 확인할 것 (실제 인시던트 이력 기반):
            1. 로그인 전 접근해야 하는 페이지/경로를 추가했다면, gateway 의 PUBLIC_EXACT_PATHS 에도 등록이 필요하다.
               빠지면 조용히 홈으로 302 된다(2026-08-02 /verify 인시던트). 페이지 경로와 그 페이지가 부르는 API
               경로는 서로 별개 항목이다. 단 이 호스트가 optional-auth 인지 protected 인지에 따라 동작이 다르니
               저장소의 .claude/agents/gateway-route-guard.md 를 먼저 읽을 것.
            2. @posselect/ui 의 CSS 변수를 새로 참조한다면 그 토큰이 실제로 정의돼 있는가. 미정의 변수는 에러 없이
               속성이 통째로 사라져 배경이 투명해진다(hero 배너 인시던트).
            3. 가격·상품명 등 신뢰가 필요한 값을 클라이언트 상태에서 서버로 되돌려 보내지 않는가.
            4. API 호출 실패를 빈 배열로 삼켜 "데이터 없음"처럼 보이게 하지 않는가 — 장애가 정상 화면으로 위장된다.
            5. 의존성 추가/갱신이 있다면 알려진 취약점이 없는가(이 시스템은 Next.js RCE 침해 이력이 있다).
            
            CI 는 Docker 빌드 성공만 확인하고 main push 가 곧 프로덕션 배포다. 확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
